<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мероприятия</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#ffc857;--section-glow:rgba(255,200,87,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">📅</span><span>Мероприятия</span></a><nav class="nav"><a href="ideas.html">💡 Идеи</a><a href="memes.html">😂 Мемы</a><a href="polls.html">🗳 Опросы</a><a href="news.html">📢 Новости</a></nav><div data-auth></div></div></header><main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Мероприятия</h1></div></div><section class="card"><div class="list" id="list">Загрузка...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
(async()=>{const {data,error}=await Portal.db.from('events').select('*').eq('published',true).order('event_date',{ascending:true}).limit(100);if(error)return list.innerHTML='<div class="error">'+Portal.esc(error.message)+'</div>';list.innerHTML=(data||[]).map(e=>`<article class="item event"><div class="date">${new Date(e.event_date).toLocaleString('ru-RU',{dateStyle:'full',timeStyle:'short'})}</div><h2>${Portal.esc(e.title)}</h2><div class="muted">${Portal.esc(e.location||'Место уточняется')}</div><p>${Portal.esc(e.description||'')}</p></article>`).join('')||'<div class="empty">Ближайших мероприятий нет.</div>'})();
</script></body></html>
