<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Банк идей — Школа №70</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#19d27c;--section-glow:rgba(25,210,124,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">💡</span><span>Банк идей</span></a><nav class="nav"><a href="memes.html">😂 Мемы</a><a href="events.html">📅 События</a><a href="polls.html">🗳 Опросы</a><a href="news.html">📢 Новости</a></nav><div data-auth></div></div></header>
<main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Банк идей</h1><p class="muted">Предлагай идеи, мероприятия, опросы и другие изменения — школа может взять их в работу.</p></div></div>
<div class="two"><section class="card"><div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px"><div class="tabs" id="tabs"><button class="tab active" data-s="all">Все</button><button class="tab" data-s="new">Новые</button><button class="tab" data-s="in_progress">В работе</button><button class="tab" data-s="done">Выполнено</button><button class="tab" data-s="rejected">Не можем</button></div><select id="sort" style="margin-left:auto;min-width:160px"><option value="likes">🔥 По лайкам</option><option value="new">🕒 Сначала новые</option><option value="old">🕰 Сначала старые</option></select></div><div class="list" id="list">Загрузка...</div></section>
<aside class="card"><h2>➕ Предложить идею</h2><div id="notice" class="hidden"></div><form class="form" id="ideaForm"><label>Название</label><input id="title" maxlength="120" required placeholder="Например: музыка на большой перемене"><label>Описание</label><textarea id="description" maxlength="1500" required placeholder="Что именно предлагаешь и зачем?"></textarea><label>Что ты предлагаешь?</label><select id="category"><option>💡 Идея</option><option>📊 Опрос</option><option>🎉 Мероприятие</option><option>😂 Мем / контент</option><option>🏫 Изменение в школе</option><option>⚽ Спорт</option><option>📚 Учёба</option><option>🎨 Отдых и творчество</option><option>📝 Другое</option></select><button class="btn primary">Отправить</button></form><p class="muted" style="font-size:12px">Не чаще одной идеи за 30 минут. Ссылки, угрозы и оскорбления блокируются.</p></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script>
<script>
let filter='all', sortMode='likes', me=null, votes=new Set(), counts={};
async function load(){
  me=await Portal.user();
  const {data:ideas,error}=await Portal.db.from('ideas').select('id,title,description,category,status,created_at,author_id').order('created_at',{ascending:false}).limit(200);
  if(error){msg(notice,error.message);return}
  if(me){const {data:vs}=await Portal.db.from('votes').select('idea_id').eq('user_id',me.id);votes=new Set((vs||[]).map(x=>x.idea_id));}
  const ids=(ideas||[]).map(x=>x.id); counts={};
  if(ids.length){const {data:v,error:ve}=await Portal.db.from('votes').select('idea_id').in('idea_id',ids);if(ve){msg(notice,ve.message);return}for(const x of(v||[]))counts[x.idea_id]=(counts[x.idea_id]||0)+1}
  window._ideas=ideas||[];render();
}
function render(){
  let arr=(_ideas||[]).filter(x=>filter==='all'||x.status===filter);
  arr.sort((a,b)=>sortMode==='likes'?((counts[b.id]||0)-(counts[a.id]||0)||new Date(b.created_at)-new Date(a.created_at)):sortMode==='old'?new Date(a.created_at)-new Date(b.created_at):new Date(b.created_at)-new Date(a.created_at));
  list.innerHTML=arr.length?arr.map(x=>{const s=Portal.statusInfo[x.status]||['Новая','new'];const c=counts[x.id]||0;return `<article class="item"><div class="item-head"><div><h3>${Portal.esc(x.title)}</h3><div class="meta">${Portal.esc(x.category)} · ${Portal.fmt(x.created_at)}</div></div><span class="badge ${s[1]}">${s[0]}</span></div><p>${Portal.esc(x.description)}</p><div class="item-actions"><button class="vote ${votes.has(x.id)?'on':''}" onclick="vote(${x.id})">👍 ${c}</button><span class="muted" style="font-size:12px">${c===1?'1 голос':c<5?c+' голоса':c+' голосов'}</span></div></article>`}).join(''):'<div class="empty">Пока здесь пусто.</div>'
}
async function vote(id){
  if(!me){location.href='auth.html';return}
  const on=votes.has(id);const r=on?await Portal.db.from('votes').delete().eq('idea_id',id).eq('user_id',me.id):await Portal.db.from('votes').insert({idea_id:id,user_id:me.id});
  if(r.error)return alert(r.error.message);await load();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.s;render()});
sort.onchange=()=>{sortMode=sort.value;render()};
ideaForm.onsubmit=async e=>{e.preventDefault();if(!me)return location.href='auth.html';hide(notice);const r=await Portal.db.rpc('submit_idea',{p_title:title.value.trim(),p_description:description.value.trim(),p_category:category.value});if(r.error)return msg(notice,r.error.message);e.target.reset();msg(notice,'Предложение отправлено — теперь его видит школа и его можно поддержать голосом.','success');await load()};
load();
</script></body></html>
