<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новости</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#a878ff;--section-glow:rgba(168,120,255,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">📢</span><span>Новости</span></a><nav class="nav"><a href="ideas.html">💡 Идеи</a><a href="memes.html">😂 Мемы</a><a href="events.html">📅 События</a><a href="polls.html">🗳 Опросы</a></nav><div data-auth></div></div></header><main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Новости</h1></div></div><section class="card"><div class="list" id="list">Загрузка...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
(async()=>{const {data,error}=await Portal.db.from('news').select('*').eq('published',true).order('created_at',{ascending:false}).limit(100);if(error)return list.innerHTML='<div class="error">'+Portal.esc(error.message)+'</div>';list.innerHTML=(data||[]).map(n=>`<article class="item news"><div class="date">${Portal.fmt(n.created_at)}</div><h2>${Portal.esc(n.title)}</h2><p>${Portal.esc(n.body)}</p></article>`).join('')||'<div class="empty">Новостей пока нет.</div>'})();
</script></body></html>
