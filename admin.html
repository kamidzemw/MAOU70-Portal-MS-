<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Админ-панель</h1><p class="muted">Управление идеями, мемами, новостями, событиями и опросами.</p></div></div><div id="guard" class="card">Проверка доступа...</div><div id="panel" class="hidden"><section class="card"><h2>💡 Идеи</h2><div id="ideas" class="list"></div></section><section class="card" style="margin-top:16px"><h2>😂 Мемы на модерации</h2><div id="memes" class="list"></div></section><section class="card" style="margin-top:16px"><h2>📢 Добавить новость</h2><form id="newsForm" class="form"><input id="nt" placeholder="Заголовок" required><textarea id="nb" placeholder="Текст" required></textarea><button class="btn primary">Опубликовать</button></form><div id="nmsg"></div></section><section class="card" style="margin-top:16px"><h2>📅 Добавить мероприятие</h2><form id="eventForm" class="form"><input id="et" placeholder="Название" required><input id="ed" type="datetime-local" required><input id="el" placeholder="Место"><textarea id="eb" placeholder="Описание"></textarea><button class="btn primary">Опубликовать</button></form><div id="emsg"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
let admin;
async function start(){admin=await Portal.profile();if(admin?.role!=='admin'){guard.innerHTML='<div class="error">Доступ только для администратора.</div>';return}guard.classList.add('hidden');panel.classList.remove('hidden');loadIdeas();loadMemes()}
async function loadIdeas(){const {data,error}=await Portal.db.from('ideas').select('*,profiles:safe_author(author_name,surname,first_name,class_name)').order('created_at',{ascending:false}).limit(100);if(error)return ideas.innerHTML='<div class="error">'+Portal.esc(error.message)+'</div>';ideas.innerHTML=(data||[]).map(i=>`<article class="item"><div class="item-head"><div><h3>${Portal.esc(i.title)}</h3><div class="meta">${Portal.esc(i.author_name||'Ученик')} · ${Portal.esc(i.category)}</div></div><select onchange="setStatus(${i.id},this.value)"><option value="new" ${i.status==='new'?'selected':''}>Новая</option><option value="in_progress" ${i.status==='in_progress'?'selected':''}>В работе</option><option value="done" ${i.status==='done'?'selected':''}>Выполнено</option><option value="rejected" ${i.status==='rejected'?'selected':''}>Не можем</option></select></div><p>${Portal.esc(i.description)}</p><div class="meta">Создано: ${Portal.fmt(i.created_at)}</div></article>`).join('')||'<div class="empty">Идей нет.</div>'}
async function setStatus(id,status){const r=await Portal.db.from('ideas').update({status}).eq('id',id);if(r.error)alert(r.error.message);else loadIdeas()}
async function loadMemes(){const {data,error}=await Portal.db.from('memes').select('*').eq('status','pending').order('created_at',{ascending:true});if(error)return memes.innerHTML='<div class="error">'+Portal.esc(error.message)+'</div>';memes.innerHTML=(data||[]).map(m=>`<article class="item"><img src="${Portal.esc(m.image_url)}" style="max-width:240px;border-radius:12px"><p>${Portal.esc(m.caption||'')}</p><button class="btn primary" onclick="moderate('${m.id}','published')">Опубликовать</button> <button class="btn danger" onclick="moderate('${m.id}','rejected')">Отклонить</button></article>`).join('')||'<div class="empty">Новых мемов нет.</div>'}
async function moderate(id,status){const r=await Portal.db.from('memes').update({status,moderated_by:admin.id,moderated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else loadMemes()}
newsForm.onsubmit=async e=>{e.preventDefault();const r=await Portal.db.from('news').insert({title:nt.value.trim(),body:nb.value.trim(),created_by:admin.id,published:true});if(r.error)return msg(nmsg,r.error.message);e.target.reset();msg(nmsg,'Новость опубликована','success')}
eventForm.onsubmit=async e=>{e.preventDefault();const r=await Portal.db.from('events').insert({title:et.value.trim(),event_date:new Date(ed.value).toISOString(),location:el.value.trim(),description:eb.value.trim(),created_by:admin.id,published:true});if(r.error)return msg(emsg,r.error.message);e.target.reset();msg(emsg,'Мероприятие опубликовано','success')}
start();
</script></body></html>
