<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Профиль</h1></div></div><div class="card" id="box">Загрузка...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
(async()=>{const u=await Portal.user(),p=await Portal.profile();if(!u)return location.href='auth.html';const emojis=['👤','😀','😎','🤓','😈','🤠','🥶','🤩','😴','🦊','🐼','🐸','🐱','🐶','🐵','🦄','🐲','🍀','🔥','⭐','🌙','🎮','🎧','⚽','🏀','🚀','💡','🎨']; if(u.id===Portal.MAIN_ADMIN_ID) emojis.push('😇');box.innerHTML=`<div class="profile-hero"><div class="profile-avatar">${Portal.esc(p?.avatar_emoji||'👤')}</div><div><h2>${Portal.esc((p?.first_name||'Ученик')+' '+(p?.surname||''))}</h2><p class="muted">${Portal.esc(p?.class_name||'Класс не указан')}</p></div></div><div class="form" style="margin-top:20px"><label>Никнейм</label><input id="nickname" maxlength="30" value="${Portal.esc(p?.nickname||'')}" placeholder="Например: Матвей_70"><label>Аватарка</label><div class="emoji-picker" id="emojiPicker">${emojis.map(e=>`<button type="button" class="emoji-choice ${e===(p?.avatar_emoji||'👤')?'active':''}" data-e="${e}">${e}</button>`).join('')}</div><button class="btn primary" id="save">Сохранить профиль</button><div id="msg" class="hidden"></div><div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border,#26304a)"><button class="btn danger" type="button" id="delete-account">🗑 Удалить мой аккаунт</button><p class="muted" style="font-size:12px;margin:8px 0 0">Ваш аккаунт будет удалён вместе с профилем и данными, связанными с ним. Это работает и для администратора.</p></div></div><p class="muted" style="font-size:13px;margin-top:18px">Никнейм и эмодзи можно менять в любое время. Администрация видит реальные имя, фамилию и класс для работы с заявками.</p>${p?.role==='admin'?'<div class="success" style="margin-top:14px">Вы администратор портала. <a href="admin.html"><u>Открыть админ-панель →</u></a></div>':''}`;let selected=p?.avatar_emoji||'👤';document.querySelectorAll('.emoji-choice').forEach(b=>b.onclick=()=>{selected=b.dataset.e;document.querySelectorAll('.emoji-choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('save').onclick=async()=>{const r=await Portal.db.from('profiles').update({nickname:document.getElementById('nickname').value.trim(),avatar_emoji:selected}).eq('id',u.id);if(r.error)return Portal.msg(document.getElementById('msg'),r.error.message);Portal.msg(document.getElementById('msg'),'Профиль сохранён.','success');setTimeout(()=>location.reload(),500)};document.getElementById('delete-account').onclick=async()=>{if(!confirm('Удалить свой аккаунт? Это действие нельзя отменить.'))return;if(!confirm('Точно удалить аккаунт и профиль? Все связанные данные ученика будут удалены.'))return;const r=await Portal.db.rpc('delete_user_account',{p_user_id:u.id});if(r.error)return Portal.msg(document.getElementById('msg'),r.error.message);await Portal.db.auth.signOut();location.href='auth.html'};})();
</script></body></html>
