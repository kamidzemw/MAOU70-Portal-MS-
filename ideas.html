<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Банк идей — Школа №70</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#19d27c;--section-glow:rgba(25,210,124,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">💡</span><span>Банк идей</span></a><nav class="nav"><a href="memes.html">😂 Мемы</a><a href="events.html">📅 События</a><a href="polls.html">🗳 Опросы</a><a href="news.html">📢 Новости</a></nav><div data-auth></div></div></header>
<main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Банк идей</h1><p class="muted">Твоя идея → обсуждение → действие.</p></div></div>
<div class="two"><section class="card"><div class="tabs" id="tabs"><button class="tab active" data-s="all">Все</button><button class="tab" data-s="new">Новые</button><button class="tab" data-s="in_progress">В работе</button><button class="tab" data-s="done">Выполнено</button><button class="tab" data-s="rejected">Не можем</button></div><div class="list" id="list">Загрузка...</div></section>
<aside class="card"><h2>➕ Предложить идею</h2><div id="notice" class="hidden"></div><form class="form" id="ideaForm"><label>Название</label><input id="title" maxlength="120" required placeholder="Например: музыка на большой перемене"><label>Описание</label><textarea id="description" maxlength="1500" required placeholder="Что именно предлагаешь и зачем?"></textarea><label>Категория</label><select id="category"><option>Мероприятия</option><option>Отдых</option><option>Учёба</option><option>Спорт</option><option>Школьная жизнь</option><option>Другое</option></select><button class="btn primary">Отправить</button></form><p class="muted" style="font-size:12px">Не чаще одной идеи за 30 минут. Ссылки, угрозы и оскорбления блокируются.</p></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script>
<script>
let filter='all', me=null, votes=new Set();
async function load(){me=await Portal.user();if(!me){list.innerHTML='<div class="empty">Чтобы голосовать и отправлять идеи, <a href="auth.html" style="color:#72edaf">войдите в аккаунт</a>.</div>';return}
const {data:ideas,error}=await Portal.db.from('ideas').select('id,title,description,category,status,created_at,author_id').order('created_at',{ascending:false}).limit(100);if(error)return msg(notice,error.message);
const {data:vs}=await Portal.db.from('votes').select('idea_id').eq('user_id',me.id);votes=new Set((vs||[]).map(x=>x.idea_id));
const ids=(ideas||[]).map(x=>x.id);let counts={};if(ids.length){const {data:v}=await Portal.db.from('votes').select('idea_id').in('idea_id',ids);for(const x of(v||[]))counts[x.idea_id]=(counts[x.idea_id]||0)+1}
window._ideas=ideas||[];render(counts)}
function render(counts={}){const arr=_ideas.filter(x=>filter==='all'||x.status===filter);list.innerHTML=arr.length?arr.map(x=>{const s=Portal.statusInfo[x.status]||['Новая','new'];return `<article class="item"><div class="item-head"><div><h3>${Portal.esc(x.title)}</h3><div class="meta">${Portal.esc(x.category)} · ${Portal.fmt(x.created_at)}</div></div><span class="badge ${s[1]}">${s[0]}</span></div><p>${Portal.esc(x.description)}</p><div class="item-actions"><button class="vote ${votes.has(x.id)?'on':''}" onclick="vote(${x.id},this)">👍 ${counts[x.id]||0}</button></div></article>`}).join(''):'<div class="empty">Пока здесь пусто.</div>'}
async function vote(id,btn){if(!me)return;const on=votes.has(id);let r;if(on)r=await Portal.db.from('votes').delete().eq('idea_id',id).eq('user_id',me.id);else r=await Portal.db.from('votes').insert({idea_id:id,user_id:me.id});if(r.error)return alert(r.error.message);await load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.s;render()});
ideaForm.onsubmit=async e=>{e.preventDefault();if(!me)return location.href='auth.html';hide(notice);const p=await Portal.profile();const r=await Portal.db.rpc('submit_idea',{p_title:title.value.trim(),p_description:description.value.trim(),p_category:category.value});if(r.error)return msg(notice,r.error.message);e.target.reset();msg(notice,'Идея отправлена и будет видна школе.','success');await load()};
load();
</script></body></html>
