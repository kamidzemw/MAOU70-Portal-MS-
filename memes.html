<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Школьные мемы</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#ff5f8f;--section-glow:rgba(255,95,143,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">😂</span><span>Школьные мемы</span></a><nav class="nav"><a href="ideas.html">💡 Идеи</a><a href="events.html">📅 События</a><a href="polls.html">🗳 Опросы</a><a href="news.html">📢 Новости</a></nav><div data-auth></div></div></header>
<main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Школьные мемы</h1><p class="muted">Публикация — только после модерации.</p></div></div>
<div class="two"><section class="card"><div class="grid memes" id="memes">Загрузка...</div></section><aside class="card"><h2>😂 Отправить мем</h2><div id="notice" class="hidden"></div><form id="form" class="form"><label>Подпись</label><textarea id="caption" maxlength="500" placeholder="Что происходит?"></textarea><label>Изображение</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required><button class="btn primary">Отправить на модерацию</button></form><p class="muted" style="font-size:12px">Не загружай чужие персональные данные, оскорбления, угрозы или запрещённый контент.</p></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
async function load(){const {data,error}=await Portal.db.from('memes').select('*').eq('status','published').order('created_at',{ascending:false}).limit(60);const ids=[...new Set((data||[]).map(m=>m.author_id).filter(Boolean))];let profiles={};if(ids.length){const r=await Portal.db.from('safe_author').select('id,nickname,avatar_emoji').in('id',ids);(r.data||[]).forEach(p=>profiles[p.id]=p)}if(error)return msg(notice,error.message);memes.innerHTML=(data||[]).map(m=>`<article class="item meme"><img src="${Portal.esc(m.image_url)}" alt="Школьный мем" loading="lazy"><div class="meme-body"><div>${Portal.esc(m.caption||'')}</div><div class="meta">${m.show_author ? `${Portal.esc(profiles[m.author_id]?.avatar_emoji||'👤')} ${Portal.nickHtml(profiles[m.author_id]?.nickname||'Ученик',m.author_id)}` : 'Автор скрыт'} · ${Portal.fmt(m.created_at)}</div></div></article>`).join('')||'<div class="empty">Мемов пока нет.</div>'}
form.onsubmit=async e=>{e.preventDefault();const u=await Portal.user();if(!u)return location.href='auth.html';hide(notice);const file=image.files[0];if(!file||file.size>5*1024*1024)return msg(notice,'Файл должен быть до 5 МБ.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${u.id}/${crypto.randomUUID()}.${ext}`;const up=await Portal.db.storage.from('memes').upload(path,file,{contentType:file.type,upsert:false});if(up.error)return msg(notice,up.error.message);const {data:pub}=Portal.db.storage.from('memes').getPublicUrl(path);const r=await Portal.db.from('memes').insert({author_id:u.id,caption:caption.value.trim(),image_path:path,image_url:pub.publicUrl,status:'pending'});if(r.error)return msg(notice,r.error.message);e.target.reset();msg(notice,'Мем отправлен на модерацию.','success')};load();
</script></body></html>
