<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — Школа №70</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="wrap auth"><a href="index.html" class="muted">← На главную</a><div class="card" style="margin-top:15px"><div class="kicker">МАОУ СОШ №70</div><h1 id="title">Создать аккаунт</h1>
<div id="notice" class="hidden"></div>
<form id="form" class="form">
<div id="signup-fields"><label>Фамилия</label><input id="surname" required><label>Имя</label><input id="first_name" required><label>Класс</label><input id="class_name" placeholder="10А" required><label>Никнейм <span class="muted">(необязательно)</span></label><input id="nickname" maxlength="30" placeholder="Например: Матвей_70"></div>
<label>Email</label><input id="email" type="email" required autocomplete="email"><label>Пароль</label><input id="password" type="password" minlength="6" required autocomplete="new-password">
<button class="btn primary" id="submit">Зарегистрироваться</button></form>
<button class="btn" id="toggle" style="margin-top:10px;width:100%">Уже есть аккаунт? Войти</button>
<p class="muted" style="font-size:13px;margin-top:16px">Имя и класс используются администрацией для обработки заявок. Другим ученикам они не показываются.</p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script>
<script>
let signup=true;
const f=document.getElementById('form');
const note=document.getElementById('notice');
const signupFields=document.getElementById('signup-fields');
const signupInputs=[...signupFields.querySelectorAll('input')];
const title=document.getElementById('title');
const submit=document.getElementById('submit');
const toggle=document.getElementById('toggle');
const emailEl=document.getElementById('email');
const passwordEl=document.getElementById('password');

function setMode(){
  title.textContent=signup?'Создать аккаунт':'Войти';
  submit.textContent=signup?'Зарегистрироваться':'Войти';
  signupFields.classList.toggle('hidden',!signup);
  signupInputs.forEach(input=>input.required=signup);
  passwordEl.autocomplete=signup?'new-password':'current-password';
  toggle.textContent=signup?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться';
  hide(note);
}

toggle.onclick=()=>{signup=!signup;setMode()};

f.onsubmit=async e=>{
  e.preventDefault();
  hide(note);
  submit.disabled=true;
  submit.textContent=signup?'Создание аккаунта…':'Вход…';
  try{
    if(!window.Portal?.db) throw new Error('Сайт не загрузил модуль Supabase. Обнови страницу (Ctrl+Shift+R).');
    const email=emailEl.value.trim();
    const password=passwordEl.value;
    if(!email||!password) throw new Error('Введи email и пароль.');
    if(signup){
      const metadata={
        surname:document.getElementById('surname').value.trim(),
        first_name:document.getElementById('first_name').value.trim(),
        class_name:document.getElementById('class_name').value.trim(),
        nickname:document.getElementById('nickname').value.trim(),
        avatar_emoji:'👤',
        name:document.getElementById('first_name').value.trim()+' '+document.getElementById('surname').value.trim()
      };
      const redirectTo=new URL('index.html',window.location.href).href;
      const {data,error}=await Portal.db.auth.signUp({email,password,options:{data:metadata,emailRedirectTo:redirectTo}});
      if(error) throw error;
      if(data?.session){
        location.href='index.html';
      }else{
        msg(note,'Аккаунт создан. Если в Supabase включено подтверждение email — сначала подтверди почту. Если письмо не приходит, отключи Confirm Email в Supabase или настрой SMTP.','success');
      }
    }else{
      const {data,error}=await Portal.db.auth.signInWithPassword({email,password});
      if(error) throw error;
      if(!data?.session) throw new Error('Вход не создал сессию. Возможно, email ещё не подтверждён.');
      location.href='index.html';
    }
  }catch(err){
    msg(note,err?.message||'Неизвестная ошибка. Открой F12 → Console и пришли красную ошибку.', 'error');
  }finally{
    submit.disabled=false;
    submit.textContent=signup?'Зарегистрироваться':'Войти';
  }
};
setMode();
</script></body></html>
