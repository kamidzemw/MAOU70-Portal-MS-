<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Опросы</title><link rel="stylesheet" href="styles.css"><style>:root{--section-accent:#6fa8ff;--section-glow:rgba(111,168,255,.10)}.page h1,.page .kicker{text-shadow:0 0 28px var(--section-glow)}.page .btn.primary{background:linear-gradient(135deg,var(--section-accent),color-mix(in srgb,var(--section-accent) 65%,#fff))}.page .date{color:var(--section-accent)}</style></head><body>
<header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="index.html"><span class="logo">🗳</span><span>Опросы</span></a><nav class="nav"><a href="ideas.html">💡 Идеи</a><a href="memes.html">😂 Мемы</a><a href="events.html">📅 События</a><a href="news.html">📢 Новости</a></nav><div data-auth></div></div></header><main class="wrap page"><div class="page-head"><div><a class="muted" href="index.html">← Портал</a><h1>Опросы</h1></div></div><div class="list" id="list">Загрузка...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
async function load(){const u=await Portal.user();const {data:ps,error}=await Portal.db.from('polls').select('*,poll_options(*)').eq('published',true).order('created_at',{ascending:false});if(error)return list.innerHTML='<div class="error">'+Portal.esc(error.message)+'</div>';let voted=new Set();if(u){const {data:v}=await Portal.db.from('poll_votes').select('poll_id').eq('user_id',u.id);voted=new Set((v||[]).map(x=>x.poll_id))}list.innerHTML=(ps||[]).map(p=>`<article class="card"><h2>${Portal.esc(p.question)}</h2><div>${(p.poll_options||[]).map(o=>`<div class="poll-option"><span>${Portal.esc(o.option_text)}</span><button class="btn ${voted.has(p.id)?'':'primary'}" ${voted.has(p.id)?'disabled':''} onclick="vote(${p.id},${o.id})">Выбрать</button></div>`).join('')}</div></article>`).join('')||'<div class="empty">Опросов пока нет.</div>'}
async function vote(pid,oid){const u=await Portal.user();if(!u)return location.href='auth.html';const r=await Portal.db.from('poll_votes').insert({poll_id:pid,option_id:oid,user_id:u.id});if(r.error)return alert(r.error.message);await load()}load();
</script></body></html>
